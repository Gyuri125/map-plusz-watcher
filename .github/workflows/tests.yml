name: Tesztek

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tesztek (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Repó kiadása
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tesztek futtatása
        run: python -m unittest discover -s tests -t . -v
